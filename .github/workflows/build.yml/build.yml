name: Build MERRY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip MERRY_AI_APK_Build_Setup.zip -d project

      - name: Build APK
        working-directory: project/MERRY_AI_Starter
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERRY-AI-APK
          path: project/MERRY_AI_Starter/app/build/outputs/apk/debug/app-debug.apk
